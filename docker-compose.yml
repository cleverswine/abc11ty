services:
  web:
    image: node:20-alpine
    working_dir: /app/web
    volumes:
      - ./web:/app/web
      - web_node_modules:/app/web/node_modules
    ports:
      - "9080:8080"
    environment:
      # bind-mounted filesystem events don't always propagate reliably
      # inside Docker (especially on macOS/Windows) - polling is slower
      # but guarantees the dev server notices changes admin/ writes to
      # _data/boo.json and picks up a rebuild + live reload.
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run serve"

  admin:
    image: node:20-alpine
    working_dir: /app/admin
    volumes:
      - ./admin:/app/admin
      - admin_node_modules:/app/admin/node_modules
      # admin/server.js resolves its data/image/css paths relative to
      # ../web, so web/ has to be mounted as its sibling here too - into
      # the same host directory the web service uses, so writes (boo.json
      # edits, uploaded images) are immediately visible to both.
      - ./web:/app/web
    ports:
      - "9321:4321"
    environment:
      # the site as reachable from a browser on this machine/network - used
      # by the admin page's "Preview site" link. Update this if you change
      # the web service's host port mapping above.
      - SITE_URL=http://localhost:9080
    command: sh -c "npm install && npm start"

volumes:
  web_node_modules:
  admin_node_modules:
