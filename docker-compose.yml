services:
  web:
    # keep the node version in sync with .nvmrc and netlify.toml
    image: node:24-alpine
    working_dir: /app/web
    volumes:
      - ./web:/app/web
      - web_node_modules:/app/web/node_modules
      # the content (boo.json and photos) lives in ./content on the server,
      # outside the git checkout, mounted where the code expects it - so
      # `git pull` never meets edited files. On first start the admin fills
      # an empty ./content from GitHub.
      - ./content:/app/web/content
    ports:
      - "9080:8080"
    environment:
      # bind-mounted filesystem events don't always propagate reliably
      # inside Docker (especially on macOS/Windows) - polling is slower
      # but guarantees the dev server notices changes admin/ writes to
      # content/boo.json and picks up a rebuild + live reload.
      - CHOKIDAR_USEPOLLING=true
    # Docker creates the node_modules volume owned by root the first time
    # it's mounted, so chown it once as root, then drop to the image's
    # unprivileged "node" user (uid/gid 1000) for the actual install/serve -
    # everything written to the bind-mounted ./web ends up owned by a
    # regular user, not root. npm ci installs exactly what
    # package-lock.json pins, so a restart never picks up newer versions.
    command: sh -c "chown -R node:node node_modules && su node -c 'npm ci && npm run serve'"
    restart: unless-stopped

  admin:
    image: node:24-alpine
    working_dir: /app/admin
    volumes:
      - ./admin:/app/admin
      - admin_node_modules:/app/admin/node_modules
      # admin/server.js resolves its content/css paths relative to ../web,
      # so web/ has to be mounted as its sibling here too, with the same
      # ./content as the web service, so writes (boo.json edits, uploaded
      # images) are immediately visible to both. web/.env (gitignored) holds
      # the Etsy and GitHub keys.
      - ./web:/app/web
      - ./content:/app/web/content
    ports:
      - "9321:4321"
    environment:
      # the site as reachable from a browser on this machine/network - used
      # by the admin page's "Preview site" link. Update this if you change
      # the web service's host port mapping above.
      - SITE_URL=http://192.168.50.210:9080
    # (Docker creates a missing ./content root-owned too, and the admin
    # writes into it.)
    command: sh -c "chown -R node:node node_modules && chown node:node /app/web/content && su node -c 'npm ci && npm start'"
    restart: unless-stopped

volumes:
  web_node_modules:
  admin_node_modules:
